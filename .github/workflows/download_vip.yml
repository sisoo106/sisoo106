// ============================================================
// ربات سوم — VIP Dedicated Bot (Cloudflare Worker)
// ============================================================
// Environment Variables مورد نیاز:
//   TELEGRAM_TOKEN     — توکن ربات تلگرام
//   VIP_BOT_SECRET     — کلید HMAC (باید با ربات اول یکی باشد)
//   BOT1_USERNAME      — نام کاربری ربات اول (برای لینک تمدید)
//   WORKER_URL         — آدرس این Worker
//   DB                 — D1 Database binding
//   ADMIN_CHAT_ID      — شناسه تلگرام ادمین (برای پنل مدیریت)
//
// برای هر مخزن فقط یک Secret در Cloudflare لازم است:
//   GH_TOKEN_1  — توکن GitHub مخزن اول
//   GH_TOKEN_2  — توکن GitHub مخزن دوم  (و ادامه...)
// owner و name مخزن‌ها از داخل ربات وارد و در D1 ذخیره می‌شوند.
// ============================================================

const MAX_STORAGE_BYTES = 80 * 1024 * 1024 * 1024; // ۸۰ گیگابایت
const SUBSCRIPTION_DAYS = 30;
const GRACE_DAYS = 2;

// ============================================================
// توابع کمکی توکن (همان ساختار ربات اول)
// ============================================================
function toBase36(n) { return BigInt(n).toString(36); }
function fromBase36(s) { return Number(BigInt(parseInt(s, 36))).toString(); }
function currentSlot() { return Math.floor(Date.now() / 120000) % 1000; }
function slotStr(s) { return s.toString().padStart(3, '0'); }

async function shortHmac(secret, data) {
  const key = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(secret),
    { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
  );
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(data));
  const b64 = btoa(String.fromCharCode(...new Uint8Array(sig)))
               .replace(/\+/g, '-')
               .replace(/\//g, '_')
               .replace(/=/g, '');
  return b64.substring(0, 10);
}

async function verifyVipToken(env, token) {
  try {
    const secret = env.VIP_BOT_SECRET || 'default_secret_change_me_32chars!';
    if (!token.startsWith('V')) return null;
    const parts = token.substring(1).split('_');
    if (parts.length !== 3) return null;
    const [slotS, chatB36, hmacR] = parts;
    if (slotS.length !== 3) return null;
    const tokenSlot = parseInt(slotS, 10);
    const now = currentSlot();
    const diff = (now - tokenSlot + 1000) % 1000;
    if (diff > 4) return null;
    const expectedHmac = await shortHmac(secret, `vip:${tokenSlot}:${chatB36}`);
    if (hmacR !== expectedHmac) return null;
    return { chatId: fromBase36(chatB36) };
  } catch { return null; }
}


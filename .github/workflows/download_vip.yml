// ============================================================
// نمایش فایل‌ها — با شماره ردیف و صفحه‌بندی ۵ فایل در هر صفحه
// ============================================================
const FILES_PER_PAGE = 5;

async function showFiles(env, chatId, page, TOKEN, editMsgId) {
  // page: شماره صفحه از ۱ به بعد
  const pageNum = Math.max(1, page || 1);
  const offset = (pageNum - 1) * FILES_PER_PAGE;

  const totalRow = await env.DB.prepare('SELECT COUNT(*) AS c FROM vip_files WHERE chat_id = ?').bind(chatId).first();
  const total = totalRow?.c || 0;
  const totalPages = Math.max(1, Math.ceil(total / FILES_PER_PAGE));
  const currentPage = Math.min(pageNum, totalPages);
  const currentOffset = (currentPage - 1) * FILES_PER_PAGE;

  if (total === 0) {
    const emptyText = `📂 <b>فایل‌های من</b>\n\nهیچ فایلی ذخیره نشده.`;
    const emptyKb = { inline_keyboard: [[{ text: '🏠 منوی اصلی', callback_data: 'main', style: 'primary' }]] };
    if (editMsgId) return await editMsg(chatId, editMsgId, emptyText, emptyKb, TOKEN);
    return await sendMsg(chatId, emptyText, emptyKb, TOKEN);
  }

  const rows = await env.DB.prepare(
    'SELECT * FROM vip_files WHERE chat_id = ? ORDER BY created_at DESC LIMIT ? OFFSET ?'
  ).bind(chatId, FILES_PER_PAGE, currentOffset).all();

  // شماره ردیف جهانی: ردیف ۱ = جدیدترین فایل در کل
  let text = `📂 <b>فایل‌های من</b>
`;
  text += `📄 صفحه <b>${currentPage}</b> از <b>${totalPages}</b> — ${total} فایل
`;

  const btns = [];
  let rowNum = currentOffset + 1; // شماره ردیف جهانی

  for (const f of (rows.results || [])) {
    const icon = f.type === 'youtube' ? '🎬' : '📄';
    const date = new Date(f.created_at).toLocaleDateString('fa-IR');
    const sizeStr = formatBytes(f.file_size);
    const passStr = f.zip_password || '—';

    text += `
┌ <b>#${rowNum}</b> ${icon} <b>${f.file_name || 'فایل'}</b>
`;
    text += `├ 📦 ${sizeStr}  |  📅 ${date}
`;
    text += `└ 🔑 <code>${passStr}</code>
`;

    // دکمه دانلود با شماره ردیف
    btns.push([
      { text: `⬇️ #${rowNum} دانلود`, url: f.link || '#', style: 'primary' },
    ]);
    // دکمه حذف با شماره ردیف
    btns.push([
      { text: `🗑 #${rowNum} حذف`, callback_data: `del_file:${f.id}`, style: 'danger' },
    ]);

    rowNum++;
  }

  // دکمه‌های ناوبری صفحات
  const nav = [];
  if (currentPage > 1) nav.push({ text: `◀️ صفحه ${currentPage - 1}`, callback_data: `files:${currentPage - 1}`, style: 'primary' });
  if (currentPage < totalPages) nav.push({ text: `صفحه ${currentPage + 1} ▶️`, callback_data: `files:${currentPage + 1}`, style: 'primary' });
  if (nav.length) btns.push(nav);

  btns.push([{ text: '🔙 منوی اصلی', callback_data: 'main', style: 'primary' }]);
  const kb = { inline_keyboard: btns };
  if (editMsgId) return await editMsg(chatId, editMsgId, text, kb, TOKEN);
  return await sendMsg(chatId, text, kb, TOKEN);
}


// لیست همه کاربران با صفحه‌بندی
const ADMIN_USERS_PER_PAGE = 5;
async function showAdminUsers(env, chatId, page, TOKEN, editMsgId) {
  const pageNum = Math.max(1, page || 1);
  const offset = (pageNum - 1) * ADMIN_USERS_PER_PAGE;
  const totalRow = await env.DB.prepare('SELECT COUNT(*) AS c FROM vip_users').first();
  const total = totalRow?.c || 0;
  const totalPages = Math.max(1, Math.ceil(total / ADMIN_USERS_PER_PAGE));
  const currentPage = Math.min(pageNum, totalPages);
  const currentOffset = (currentPage - 1) * ADMIN_USERS_PER_PAGE;

  if (total === 0) {
    const t = `👥 <b>کاربران VIP</b>\n\nهیچ کاربری ثبت نشده.`;
    const k = { inline_keyboard: [[{ text: '🔙 بازگشت', callback_data: 'adm_menu', style: 'primary' }]] };
    if (editMsgId) return await editMsg(chatId, editMsgId, t, k, TOKEN);
    return await sendMsg(chatId, t, k, TOKEN);
  }

  const rows = await env.DB.prepare(
    'SELECT * FROM vip_users ORDER BY subscribed_at DESC LIMIT ? OFFSET ?'
  ).bind(ADMIN_USERS_PER_PAGE, currentOffset).all();

  let text = `👥 <b>کاربران VIP</b> — صفحه ${currentPage}/${totalPages} (${total} کاربر)\n\n`;
  const btns = [];

  for (const u of (rows.results || [])) {
    const statusEmoji = u.status === 'active' ? '✅' : u.status === 'grace' ? '⚠️' : '❌';
    const daysLeft = Math.max(0, Math.ceil((u.expires_at - Date.now()) / 86400000));
    const name = u.first_name || 'بدون نام';
    const username = u.username ? `@${u.username}` : '—';
    text += `${statusEmoji} <b>${name}</b> (${username})\n`;
    text += `🆔 <code>${u.chat_id}</code> | 📦 ${u.repo_key || '—'} | ⏳ ${daysLeft} روز\n\n`;
    btns.push([{ text: `⚙️ مدیریت ${name}`, callback_data: `adm_user:${u.chat_id}`, style: 'primary' }]);
  }

  const nav = [];
  if (currentPage > 1) nav.push({ text: `◀️ قبل`, callback_data: `adm_users:${currentPage - 1}`, style: 'primary' });
  if (currentPage < totalPages) nav.push({ text: `بعد ▶️`, callback_data: `adm_users:${currentPage + 1}`, style: 'primary' });
  if (nav.length) btns.push(nav);
  btns.push([{ text: '🔙 منوی ادمین', callback_data: 'adm_menu', style: 'primary' }]);

  const kb = { inline_keyboard: btns };
  if (editMsgId) return await editMsg(chatId, editMsgId, text, kb, TOKEN);
  return await sendMsg(chatId, text, kb, TOKEN);
}


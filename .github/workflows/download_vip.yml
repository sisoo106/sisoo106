// خواندن همه مخازن از دیتابیس + ترکیب با توکن از env
async function getAllRepos(env) {
  try {
    const rows = await env.DB.prepare(
      'SELECT * FROM repos ORDER BY repo_key ASC'
    ).all();
    const repos = [];
    for (const r of (rows.results || [])) {
      const token = env[r.token_secret]; // مثلاً env['GH_TOKEN_1']
      if (!token) continue;             // اگر توکن در Secrets نبود رد می‌شود
      repos.push({ owner: r.owner, name: r.name, token, key: r.repo_key, tokenSecret: r.token_secret });
    }
    return repos;
  } catch { return []; }
}

async function getAvailableRepo(env) {
  const repos = await getAllRepos(env);
  if (repos.length === 0) return null;
  const assigned = await env.DB.prepare(
    "SELECT repo_key FROM vip_users WHERE repo_key IS NOT NULL AND status != 'revoked'"
  ).all();
  const assignedKeys = new Set((assigned.results || []).map(r => r.repo_key));
  return repos.find(r => !assignedKeys.has(r.key)) || null;
}

// تخصیص atomic مخزن به کاربر — از race condition جلوگیری می‌کند
// اگر مخزن قبلاً به کاربر دیگری داده شده باشد، INSERT فیل می‌کند
async function assignRepoToUser(env, chatId, repoKey, subscribed_at, expires_at, username, firstName) {
  try {
    // ابتدا چک می‌کنیم مخزن هنوز آزاد است
    const inUse = await env.DB.prepare(
      "SELECT chat_id FROM vip_users WHERE repo_key = ? AND status != 'revoked' AND chat_id != ?"
    ).bind(repoKey, chatId).first();
    if (inUse) return false; // مخزن قبلاً گرفته شده

    // INSERT یا UPDATE atomic
    await env.DB.prepare(
      'INSERT INTO vip_users (chat_id, repo_key, subscribed_at, expires_at, status, username, first_name) VALUES (?, ?, ?, ?, ?, ?, ?) ON CONFLICT(chat_id) DO UPDATE SET repo_key=excluded.repo_key, subscribed_at=excluded.subscribed_at, expires_at=excluded.expires_at, status=excluded.status, username=excluded.username, first_name=excluded.first_name'
    ).bind(chatId, repoKey, subscribed_at, expires_at, 'active', username, firstName).run();

    // تأیید نهایی — مطمئن می‌شویم همین کاربر صاحب مخزن شده
    const check = await env.DB.prepare(
      "SELECT chat_id FROM vip_users WHERE repo_key = ? AND status != 'revoked' AND chat_id != ?"
    ).bind(repoKey, chatId).first();
    if (check) {
      // کاربر دیگری همزمان گرفت — برمی‌گردیم
      await env.DB.prepare("UPDATE vip_users SET repo_key = NULL WHERE chat_id = ?").bind(chatId).run();
      return false;
    }
    return true;
  } catch (e) {
    console.error('assignRepoToUser error:', e);
    return false;
  }
}

async function getRepoByKey(env, key) {
  const repos = await getAllRepos(env);
  return repos.find(r => r.key === key) || null;
}



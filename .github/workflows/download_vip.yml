// GitHub
// ============================================================
async function triggerWorkflow(env, repo, chatId, inputs) {
  const body = {
    ref: 'main',
    inputs: { ...inputs, user_id: chatId.toString() }
  };
  const res = await fetch(
  `https://api.github.com/repos/${repo.owner}/${repo.name}/actions/workflows/download_vip.yml/dispatches`,
  {
    method: 'POST',
    headers: {
      Authorization: `token ${repo.token}`,
      Accept: 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
      'User-Agent': 'CloudflareWorker-VIPBot/1.0'   // ← خط اضافه شده
    },
    body: JSON.stringify(body)
  }
);
  if (res.status !== 204) {
    console.error(`GitHub dispatch error: ${res.status} ${await res.text()}`);
    return false;
  }
  return true;
}

async function deleteBranch(repo, branch) {
  try {
    await fetch(`https://api.github.com/repos/${repo.owner}/${repo.name}/git/refs/heads/${branch}`, {
  method: 'DELETE',
  headers: { 
    Authorization: `token ${repo.token}`, 
    Accept: 'application/vnd.github.v3+json',
    'User-Agent': 'CloudflareWorker-VIPBot/1.0'   // ← خط اضافه شده
  }
});
  } catch {}
}



async function verifyRenewalToken(env, token) {
  try {
    const secret = env.VIP_BOT_SECRET || 'default_secret_change_me_32chars!';
    if (!token.startsWith('VR')) return null;
    const parts = token.substring(2).split('_');
    // ساختار جدید: VR{slot}_{chatB36}_{txnB36}_{hmac}  (4 قسمت)
    // ساختار قدیم: VR{slot}_{chatB36}_{hmac}            (3 قسمت — backward compat)
    if (parts.length < 3 || parts.length > 4) return null;
    const slotS = parts[0];
    if (slotS.length !== 3) return null;
    const tokenSlot = parseInt(slotS, 10);
    const now = currentSlot();
    const diff = (now - tokenSlot + 1000) % 1000;
    if (diff > 4) return null;

    if (parts.length === 4) {
      // ساختار جدید با txn_id
      const [, chatB36, txnB36, hmacR] = parts;
      const expectedHmac = await shortHmac(secret, `renew:${tokenSlot}:${chatB36}:${txnB36}`);
      if (hmacR !== expectedHmac) return null;
      // txnId را از base36 به hex برمی‌گردانیم
      const txnHex = BigInt(parseInt(txnB36, 36)).toString(16);
      return { chatId: fromBase36(chatB36), txnId: txnHex };
    } else {
      // ساختار قدیم (backward compat)
      const [, chatB36, hmacR] = parts;
      const expectedHmac = await shortHmac(secret, `renew:${tokenSlot}:${chatB36}`);
      if (hmacR !== expectedHmac) return null;
      return { chatId: fromBase36(chatB36), txnId: null };
    }
  } catch { return null; }
}

// جدول vip_consumed_txn در دیتابیس ربات سوم — برای جلوگیری از مصرف مجدد
// کاملاً مستقل از ربات اول — هیچ ارتباطی بین دو ربات نیست
async function isTxnConsumed(env, txnId) {
  if (!txnId) return false;
  try {
    const row = await env.DB.prepare('SELECT txn_id FROM vip_consumed_txn WHERE txn_id = ?').bind(txnId).first();
    return !!row;
  } catch { return false; }
}

async function markTxnConsumed(env, txnId) {
  if (!txnId) return;
  try {
    await env.DB.prepare('INSERT OR IGNORE INTO vip_consumed_txn (txn_id, consumed_at) VALUES (?, ?)').bind(txnId, Date.now()).run();
  } catch {}
}


// ============================================================
// پردازش دانلود
// ============================================================
async function startDownload(env, chatId, state, password, user, TOKEN) {
  const repo = await getRepoByKey(env, user.repo_key);
  if (!repo) {
    await sendMsg(chatId, `❌ ریپوی اختصاصی شما یافت نشد. با پشتیبانی تماس بگیرید.`, backKeyboard(), TOKEN);
    return;
  }
  const existingJob = await getJob(env, chatId);
  if (existingJob?.status === 'processing') {
    await sendMsg(chatId, `⚠️ یک عملیات در حال اجرا دارید. صبر کنید.`, backKeyboard(), TOKEN);
    return;
  }
  const waitRes = await sendMsg(chatId, `⏳ <b>در حال پردازش...</b>\n\nدرخواست در صف قرار گرفت.`, null, TOKEN);
  const waitMsgId = waitRes?.result?.message_id;
  let triggered = false;
  let jobPayload = { zip_password: password };

  if (state.type === 'link') {
    jobPayload = { ...jobPayload, type: 'file', file_name: state.fileName || 'file' };
    await setJob(env, chatId, 'processing', jobPayload, waitMsgId, null);
    triggered = await triggerWorkflow(env, repo, chatId, {
      file_url: state.fileUrl, file_id: '', zip_password: password, media_url: ''
    });
  } else if (state.type === 'upload') {
    jobPayload = { ...jobPayload, type: 'file', file_name: state.fileName || 'file', file_size: state.fileSize || 0 };
    await setJob(env, chatId, 'processing', jobPayload, waitMsgId, null);
    triggered = await triggerWorkflow(env, repo, chatId, {
      file_url: '', file_id: state.fileId,
      chat_id: chatId.toString(), message_id: (state.msgId || '').toString(),
      zip_password: password, media_url: ''
    });
  } else if (state.type === 'youtube') {
    jobPayload = { ...jobPayload, type: 'youtube', file_name: 'YouTube_video.mp4' };
    await setJob(env, chatId, 'processing', jobPayload, waitMsgId, null);
    triggered = await triggerWorkflow(env, repo, chatId, {
      file_url: '', file_id: '', zip_password: password,
      media_url: state.youtubeUrl,
      desired_quality: state.quality || '720',
      min_quality: '360',
      max_size_mb: '4096'
    });
  }

  if (!triggered) {
    if (waitMsgId) await delMsg(chatId, waitMsgId, TOKEN);
    await deleteJob(env, chatId);
    await sendMsg(chatId, `❌ خطا در شروع عملیات. دوباره تلاش کنید.`, backKeyboard(), TOKEN);
  }
}


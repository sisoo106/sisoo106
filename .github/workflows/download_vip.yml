// Cron: چک منقضی‌شده‌ها
// ============================================================
async function checkExpired(env, TOKEN) {
  if (!env.DB) {
    console.error('❌ D1 database binding (env.DB) is missing!');
    return;
  }
  const now = Date.now();
  const bot1 = env.BOT1_USERNAME || 'filesmanagement_bot';

  // active → grace
  const expired = await env.DB.prepare(
    "SELECT * FROM vip_users WHERE status = 'active' AND expires_at < ?"
  ).bind(now).all();

  for (const user of (expired.results || [])) {
    const graceEnd = user.expires_at + GRACE_DAYS * 86400000;
    if (now < graceEnd) {
      await env.DB.prepare("UPDATE vip_users SET status = 'grace' WHERE chat_id = ?").bind(user.chat_id).run();
      const dLeft = Math.ceil((graceEnd - now) / 86400000);
      await sendMsg(user.chat_id,
        `⚠️ <b>اشتراک VIP شما منقضی شد</b>\n\nمهلت تمدید: <b>${dLeft} روز</b>\n\nدر صورت عدم تمدید، تمام فایل‌های شما حذف می‌شوند.`,
        { inline_keyboard: [[{ text: '🔄 تمدید اشتراک', url: `https://t.me/${bot1}`, style: 'success' }]] }, TOKEN);
    } else {
      await revokeUser(env, user, TOKEN);
    }
  }

  // grace → revoke
  const graceExpired = await env.DB.prepare(
    "SELECT * FROM vip_users WHERE status = 'grace' AND expires_at + ? < ?"
  ).bind(GRACE_DAYS * 86400000, now).all();
  for (const user of (graceExpired.results || [])) {
    await revokeUser(env, user, TOKEN);
  }
}

async function revokeUser(env, user, TOKEN) {
  const bot1 = env.BOT1_USERNAME || 'filesmanagement_bot';
  try {
    if (user.repo_key) {
      const repo = await getRepoByKey(env, user.repo_key);
      if (repo) {
        const files = await env.DB.prepare('SELECT branch_name FROM vip_files WHERE chat_id = ?').bind(user.chat_id).all();
        for (const f of (files.results || [])) if (f.branch_name) await deleteBranch(repo, f.branch_name);
      }
    }
    await env.DB.prepare('DELETE FROM vip_files WHERE chat_id = ?').bind(user.chat_id).run();
    await env.DB.prepare('DELETE FROM vip_jobs WHERE chat_id = ?').bind(user.chat_id).run();
    await env.DB.prepare('DELETE FROM vip_state WHERE chat_id = ?').bind(user.chat_id).run();
    // ریپو رو آزاد کن ولی backup بگیر برای تمدید
    await env.DB.prepare("UPDATE vip_users SET status = 'revoked', repo_key_backup = repo_key, repo_key = NULL WHERE chat_id = ?")
      .bind(user.chat_id).run();
    await sendMsg(user.chat_id,
      `❌ <b>اشتراک VIP شما به پایان رسید</b>\n\nتمام فایل‌های شما حذف شدند.\nبرای خرید مجدد اشتراک:`,
      { inline_keyboard: [[{ text: '🛒 خرید اشتراک', url: `https://t.me/${bot1}`, style: 'success' }]] }, TOKEN);
  } catch (e) { console.error('revokeUser error:', e); }
}

// ============================================================
// Worker Main
// ============================================================
export default {
  async fetch(request, env, ctx) {
    const TOKEN = env.TELEGRAM_TOKEN;
    if (!TOKEN) return new Response('No token', { status: 500 });

    ctx.waitUntil(initDB(env));

    const url = new URL(request.url);
    const path = url.pathname;

    // ============================================================
    // API از GitHub Actions
    // ============================================================
    if (path === '/api/started' && request.method === 'POST') {
      const data = await request.json().catch(() => ({}));
      const chatId = data.user_id?.toString();
      if (chatId) {
        const job = await getJob(env, chatId);
        if (job?.message_id) await editMsg(chatId, job.message_id, `⏳ <b>شروع شد...</b>\n\nعملیات آغاز شد.`, null, TOKEN);
      }
      return new Response('OK');
    }

    if (path === '/api/progress' && request.method === 'POST') {
      const data = await request.json().catch(() => ({}));
      const chatId = data.user_id?.toString();
      if (!chatId) return new Response('OK');
      const job = await getJob(env, chatId);
      if (!job?.message_id) return new Response('OK');
      const { stage, percent, total_chunks, uploaded_chunks } = data;
      let stageText = stage === 'download' ? '⬇️ دانلود...' : stage === 'compress' ? '🗜 فشرده‌سازی...' : '⬆️ آپلود...';
      let txt = stageText;
      if (percent > 0) txt += `\n${buildBar(percent)} ${percent}%`;
      if (total_chunks !== undefined) txt += `\n📦 مجموع: ${total_chunks} بخش`;
      if (uploaded_chunks !== undefined) txt += `\n✅ آپلود: ${uploaded_chunks}`;
      await editMsg(chatId, job.message_id, `⏳ <b>در حال پردازش...</b>\n\n${txt}`, null, TOKEN);
      return new Response('OK');
    }

    if (path === '/api/complete' && request.method === 'POST') {
      const data = await request.json().catch(() => ({}));
      const chatId = data.user_id?.toString();
      const branch = data.branch || data.branch_name;
      if (!chatId || !branch) return new Response('OK');

      const job = await getJob(env, chatId);
      if (!job) return new Response('OK');
      const user = await getUser(env, chatId);
      if (!user?.repo_key) return new Response('OK');
      const repo = await getRepoByKey(env, user.repo_key);
      if (!repo) return new Response('OK');

      const link = `https://codeload.github.com/${repo.owner}/${repo.name}/zip/refs/heads/${branch}`;
      const payload = job.payload || {};
      const password = payload.zip_password || '';
      const fileName = payload.file_name || 'فایل';
      const fileSize = Number(data.file_size) || payload.file_size || 0;

      // بررسی سقف فضا
      const usedBytes = await getUserStorageBytes(env, chatId);
      if (usedBytes + fileSize > MAX_STORAGE_BYTES) {
        if (job.message_id) await delMsg(chatId, job.message_id, TOKEN);
        await deleteBranch(repo, branch);
        await deleteJob(env, chatId);
        await sendMsg(chatId,
          `❌ <b>فضای کافی ندارید</b>\n\nفایل پردازش شد اما ${formatBytes(usedBytes)} از ${formatBytes(MAX_STORAGE_BYTES)} مصرف شده.\n\nبرخی فایل‌های قدیمی را حذف کنید.`,
          { inline_keyboard: [[{ text: '📂 مدیریت فایل‌ها', callback_data: 'files:0', style: 'primary' }]] }, TOKEN);
        return new Response('OK');
      }

      await env.DB.prepare(
        'INSERT INTO vip_files (chat_id, branch_name, file_name, file_size, created_at, type, link, zip_password) VALUES (?, ?, ?, ?, ?, ?, ?, ?)'
      ).bind(chatId, branch, fileName, fileSize, Date.now(), payload.type || 'file', link, password).run();

      if (job.message_id) await delMsg(chatId, job.message_id, TOKEN);
      await deleteJob(env, chatId);

      const icon = payload.type === 'youtube' ? '🎬' : '📄';
      await sendMsg(chatId,
        `✅ <b>${icon} آماده دانلود!</b>\n\n` +
        `📄 <b>نام:</b> ${fileName}\n` +
        `📦 <b>حجم:</b> ${formatBytes(fileSize)}\n\n` +
        `🔗 <b>لینک دانلود:</b>\n${link}\n\n` +
        `🔑 <b>رمز فایل:</b> <code>${password}</code>\n\n` +
        `📌 برای استخراج: فایل zip دانلودی را باز کنید و رمز بالا را وارد کنید (7-Zip یا WinRAR).`,
        { inline_keyboard: [
          [{ text: '📂 فایل‌های من', callback_data: 'files:0', style: 'primary' }],
          [{ text: '🏠 منوی اصلی', callback_data: 'main', style: 'primary' }]
        ] }, TOKEN);
      return new Response('OK');
    }

    if (path === '/api/failed' && request.method === 'POST') {
      const data = await request.json().catch(() => ({}));
      const chatId = data.user_id?.toString();
      if (chatId) {
        const job = await getJob(env, chatId);
        if (job?.message_id) await delMsg(chatId, job.message_id, TOKEN);
        await deleteJob(env, chatId);
        await sendMsg(chatId, `❌ <b>خطا در پردازش</b>\n\nدوباره تلاش کنید.`, backKeyboard(), TOKEN);
      }
      return new Response('OK');
    }

    if (request.method !== 'POST') return new Response('VIP Bot Active ✅');

    let update;
    try { update = await request.json(); } catch { return new Response('Bad Request', { status: 400 }); }

    // ============================================================
    // Callback Query
    // ============================================================
    if (update.callback_query) {
      const cb = update.callback_query;
      const cbChatId = cb.message?.chat?.id?.toString();
      const cbData = cb.data || '';
      const cbMsgId = cb.message?.message_id;

      await tgCall(TOKEN, 'answerCallbackQuery', { callback_query_id: cb.id });

      const cbUser = await getUser(env, cbChatId);
      // ادمین از بررسی VIP معاف است
      if (!isAdmin(env, cbChatId)) {
        if (!cbUser || cbUser.status === 'revoked') {
          await editMsg(cbChatId, cbMsgId, `🔒 دسترسی VIP ندارید.`,
            { inline_keyboard: [[{ text: '🛒 خرید اشتراک', url: `https://t.me/${env.BOT1_USERNAME || 'filesmanagement_bot'}`, style: 'success' }]] }, TOKEN);
          return new Response('OK');
        }
        if (cbUser.status === 'grace') {
          await editMsg(cbChatId, cbMsgId, `⚠️ اشتراک منقضی شده. برای ادامه تمدید کنید.`,
            { inline_keyboard: [[{ text: '🔄 تمدید', url: `https://t.me/${env.BOT1_USERNAME || 'filesmanagement_bot'}`, style: 'success' }]] }, TOKEN);
          return new Response('OK');
        }
      }

      if (cbData === 'main') {
        await deleteState(env, cbChatId);
        await showMain(cbChatId, cbUser, TOKEN, env, cbMsgId);
        return new Response('OK');
      }

      if (cbData === 'dl_link') {
        await setState(env, cbChatId, { step: 'awaiting_url' });
        await editMsg(cbChatId, cbMsgId, `📥 <b>دانلود از لینک</b>\n\nلینک مستقیم فایل را ارسال کنید:`,
          cancelKeyboard(), TOKEN);
        return new Response('OK');
      }

      if (cbData === 'dl_upload') {
        await setState(env, cbChatId, { step: 'awaiting_file' });
        await editMsg(cbChatId, cbMsgId, `📤 <b>آپلود فایل</b>\n\nفایل خود را برای من ارسال کنید:`,
          cancelKeyboard(), TOKEN);
        return new Response('OK');
      }

      if (cbData === 'dl_yt') {
        await setState(env, cbChatId, { step: 'awaiting_yt_url' });
        await editMsg(cbChatId, cbMsgId, `🎬 <b>یوتوپیا</b>\n\nلینک ویدیوی یوتیوب را ارسال کنید:`,
          cancelKeyboard(), TOKEN);
        return new Response('OK');
      }

      if (cbData === 'cancel') {
        await deleteState(env, cbChatId);
        await showMain(cbChatId, cbUser, TOKEN, env, cbMsgId);
        return new Response('OK');
      }

      if (cbData.startsWith('files:')) {
        // عدد بعد از : شماره صفحه است (از ۱ به بعد)
        const page = parseInt(cbData.split(':')[1]) || 1;
        await showFiles(env, cbChatId, page, TOKEN, cbMsgId);
        return new Response('OK');
      }

      if (cbData === 'storage') {
        const usedBytes = await getUserStorageBytes(env, cbChatId);
        const pct = Math.min(100, Math.round(usedBytes / MAX_STORAGE_BYTES * 100));
        await editMsg(cbChatId, cbMsgId,
          `💾 <b>فضای ذخیره‌سازی</b>\n\n${buildBar(pct)} ${pct}%\n\n` +
          `✅ استفاده: <b>${formatBytes(usedBytes)}</b>\n` +
          `📦 کل: <b>${formatBytes(MAX_STORAGE_BYTES)}</b>\n` +
          `🆓 آزاد: <b>${formatBytes(MAX_STORAGE_BYTES - usedBytes)}</b>`,
          { inline_keyboard: [
            [{ text: '🗑 مدیریت فایل‌ها', callback_data: 'files:0', style: 'primary' }],
            [{ text: '🔙 منوی اصلی', callback_data: 'main', style: 'primary' }]
          ] }, TOKEN);
        return new Response('OK');
      }

      if (cbData.startsWith('del_file:')) {
        const fileId = parseInt(cbData.split(':')[1]);
        const f = await env.DB.prepare('SELECT * FROM vip_files WHERE id = ? AND chat_id = ?').bind(fileId, cbChatId).first();
        if (f) {
          if (cbUser.repo_key && f.branch_name) {
            const repo = await getRepoByKey(env, cbUser.repo_key);
            if (repo) await deleteBranch(repo, f.branch_name);
          }
          await env.DB.prepare('DELETE FROM vip_files WHERE id = ?').bind(fileId).run();
        }
        await showFiles(env, cbChatId, 1, TOKEN, cbMsgId);
        return new Response('OK');
      }

      // انتخاب کیفیت یوتیوب
      if (cbData.startsWith('yt_q:')) {
        const quality = cbData.split(':')[1];
        const state = await getState(env, cbChatId);
        if (!state || state.step !== 'awaiting_yt_quality') return new Response('OK');
        await setState(env, cbChatId, { ...state, step: 'awaiting_pass', quality });
        const passBtn = generatePassword();
        await editMsg(cbChatId, cbMsgId,
          `🎬 کیفیت: <b>${quality}p</b>\n\n🔑 رمز فایل را تایپ کنید یا رمز تصادفی بزنید:`,
          passKeyboard(passBtn), TOKEN);
        return new Response('OK');
      }

      // استفاده از رمز پیشنهادی
      if (cbData.startsWith('use_pass:')) {
        const password = cbData.split(':').slice(1).join(':');
        const state = await getState(env, cbChatId);
        if (!state || state.step !== 'awaiting_pass') return new Response('OK');
        await editMsg(cbChatId, cbMsgId, `⏳ <b>در حال شروع...</b>\n\nدرخواست ارسال شد.`, null, TOKEN);
        await deleteState(env, cbChatId);
        await startDownload(env, cbChatId, state, password, cbUser, TOKEN);
        return new Response('OK');
      }

      // ============================================================
      // Callback های ادمین
      // ============================================================
      if (isAdmin(env, cbChatId)) {
        if (cbData === 'adm_menu') {
          await showAdminMenu(cbChatId, TOKEN, cbMsgId);
          return new Response('OK');
        }

        if (cbData === 'adm_repos') {
          await showAdminRepos(env, cbChatId, TOKEN, cbMsgId);
          return new Response('OK');
        }

        if (cbData === 'adm_addrepo') {
          await setState(env, cbChatId, { step: 'adm_addrepo_input' });
          await editMsg(cbChatId, cbMsgId,
            `➕ <b>اضافه کردن مخزن جدید</b>\n\n` +
            `اطلاعات مخزن را در این فرمت ارسال کنید:\n\n` +
            `<code>owner/repo-name/GH_TOKEN_1</code>\n\n` +
            `• <b>owner</b>: نام کاربری GitHub\n` +
            `• <b>repo-name</b>: نام مخزن\n` +
            `• <b>GH_TOKEN_1</b>: نام Secret که توکن را در آن ذخیره کردید\n\n` +
            `⚠️ قبل از اضافه کردن، مطمئن شوید Secret را در Cloudflare تنظیم کرده‌اید.`,
            { inline_keyboard: [[{ text: '❌ انصراف', callback_data: 'adm_repos', style: 'danger' }]] }, TOKEN);
          return new Response('OK');
        }

        if (cbData.startsWith('adm_delrepo:')) {
          const repoKey = cbData.split(':')[1];
          // بررسی آیا مخزن به کاربری تخصیص دارد
          const inUse = await env.DB.prepare(
            "SELECT chat_id FROM vip_users WHERE repo_key = ? AND status != 'revoked'"
          ).bind(repoKey).first();
          if (inUse) {
            await editMsg(cbChatId, cbMsgId,
              `❌ مخزن <b>${repoKey}</b> در حال حاضر به کاربر <code>${inUse.chat_id}</code> تخصیص دارد و قابل حذف نیست.\n\nابتدا مخزن کاربر را تغییر دهید.`,
              { inline_keyboard: [[{ text: '🔙 بازگشت', callback_data: 'adm_repos', style: 'primary' }]] }, TOKEN);
            return new Response('OK');
          }
          await env.DB.prepare('DELETE FROM repos WHERE repo_key = ?').bind(repoKey).run();
          await showAdminRepos(env, cbChatId, TOKEN, cbMsgId);
          return new Response('OK');
        }

        if (cbData === 'adm_search') {
          await setState(env, cbChatId, { step: 'adm_search' });
          await editMsg(cbChatId, cbMsgId,
            `🔍 <b>جستجوی کاربر</b>\n\nشناسه تلگرام یا یوزرنیم کاربر را وارد کنید:`,
            { inline_keyboard: [[{ text: '❌ انصراف', callback_data: 'adm_menu', style: 'danger' }]] }, TOKEN);
          return new Response('OK');
        }

        if (cbData.startsWith('adm_users:')) {
          const page = parseInt(cbData.split(':')[1]) || 1;
          await showAdminUsers(env, cbChatId, page, TOKEN, cbMsgId);
          return new Response('OK');
        }

        if (cbData.startsWith('adm_user:')) {
          const targetChatId = cbData.split(':')[1];
          await showAdminUserProfile(env, cbChatId, targetChatId, TOKEN, cbMsgId);
          return new Response('OK');
        }

        if (cbData.startsWith('adm_chrepo:')) {
          const targetChatId = cbData.split(':')[1];
          const repos = await getAllRepos(env);
          if (repos.length === 0) {
            await editMsg(cbChatId, cbMsgId, `❌ هیچ مخزنی تنظیم نشده.`,
              { inline_keyboard: [[{ text: '🔙 بازگشت', callback_data: `adm_user:${targetChatId}`, style: 'primary' }]] }, TOKEN);
            return new Response('OK');
          }
          const repoButtons = repos.map(r => [{ text: `${r.key}: ${r.owner}/${r.name}`, callback_data: `adm_setrepo:${targetChatId}:${r.key}`, style: 'primary' }]);
          repoButtons.push([{ text: '❌ انصراف', callback_data: `adm_user:${targetChatId}`, style: 'danger' }]);
          await editMsg(cbChatId, cbMsgId,
            `🗄 <b>انتخاب مخزن جدید</b>\n\nمخزن مورد نظر را انتخاب کنید:`,
            { inline_keyboard: repoButtons }, TOKEN);
          return new Response('OK');
        }

        if (cbData.startsWith('adm_setrepo:')) {
          const parts = cbData.split(':');
          const targetChatId = parts[1];
          const repoKey = parts[2];
          const repo = await getRepoByKey(env, repoKey);
          if (!repo) {
            await editMsg(cbChatId, cbMsgId, `❌ مخزن یافت نشد.`,
              { inline_keyboard: [[{ text: '🔙 بازگشت', callback_data: `adm_user:${targetChatId}`, style: 'primary' }]] }, TOKEN);
            return new Response('OK');
          }
          await env.DB.prepare('UPDATE vip_users SET repo_key = ? WHERE chat_id = ?')
            .bind(repoKey, targetChatId).run();
          await sendMsg(targetChatId,
            `🔄 <b>مخزن اختصاصی شما تغییر کرد.</b>\n\n📦 مخزن جدید: <b>${repo.owner}/${repo.name}</b>`, null, TOKEN);
          await editMsg(cbChatId, cbMsgId,
            `✅ مخزن کاربر <code>${targetChatId}</code> به <b>${repoKey}</b> تغییر یافت.`,
            { inline_keyboard: [[{ text: '🔙 پروفایل کاربر', callback_data: `adm_user:${targetChatId}`, style: 'primary' }]] }, TOKEN);
          return new Response('OK');
        }

        if (cbData.startsWith('adm_chtime:')) {
          const targetChatId = cbData.split(':')[1];
          await setState(env, cbChatId, { step: 'adm_chtime', targetChatId });
          await editMsg(cbChatId, cbMsgId,
            `⏳ <b>تغییر زمان اشتراک</b>\n\nتعداد روز را وارد کنید:\n• عدد مثبت: افزایش\n• عدد منفی: کاهش\n\nمثال: <code>30</code> یا <code>-7</code>`,
            { inline_keyboard: [[{ text: '❌ انصراف', callback_data: `adm_user:${targetChatId}`, style: 'danger' }]] }, TOKEN);
          return new Response('OK');
        }

        if (cbData.startsWith('adm_resetrepo:')) {
          const targetChatId = cbData.split(':')[1];
          const targetUser = await getUser(env, targetChatId);
          if (!targetUser?.repo_key) {
            await editMsg(cbChatId, cbMsgId, `❌ کاربر مخزن فعالی ندارد.`,
              { inline_keyboard: [[{ text: '🔙 بازگشت', callback_data: `adm_user:${targetChatId}`, style: 'primary' }]] }, TOKEN);
            return new Response('OK');
          }
          const repo = await getRepoByKey(env, targetUser.repo_key);
          if (repo) {
            const files = await env.DB.prepare('SELECT branch_name FROM vip_files WHERE chat_id = ?').bind(targetChatId).all();
            for (const f of (files.results || [])) if (f.branch_name) await deleteBranch(repo, f.branch_name);
          }
          await env.DB.prepare('DELETE FROM vip_files WHERE chat_id = ?').bind(targetChatId).run();
          await sendMsg(targetChatId,
            `🔄 <b>اطلاعات مخزن شما ریست شد.</b>\n\nتمام فایل‌های ذخیره‌شده پاک شدند.`, null, TOKEN);
          await editMsg(cbChatId, cbMsgId,
            `✅ اطلاعات مخزن کاربر <code>${targetChatId}</code> ریست شد.`,
            { inline_keyboard: [[{ text: '🔙 پروفایل کاربر', callback_data: `adm_user:${targetChatId}`, style: 'primary' }]] }, TOKEN);
          return new Response('OK');
        }
      }

      return new Response('OK');
    }

    // ============================================================
    // پیام متنی / فایل
    // ============================================================
    if (!update.message) return new Response('OK');

    const msg = update.message;
    const chatId = msg.chat?.id?.toString();
    const text = msg.text || '';

    if (!chatId) return new Response('OK');

    // ============================================================
    // /admin — پنل مدیریت (فقط ادمین)
    // ============================================================
    if (text.startsWith('/admin')) {
      if (!isAdmin(env, chatId)) {
        await sendMsg(chatId, `🔒 دسترسی مجاز نیست.`, null, TOKEN);
        return new Response('OK');
      }
      await showAdminMenu(chatId, TOKEN);
      return new Response('OK');
    }

    // ============================================================
    // /start
    // ============================================================
    if (text.startsWith('/start')) {
      const param = text.substring(6).trim();
      const firstName = msg.from?.first_name || 'کاربر';
      const bot1 = env.BOT1_USERNAME || 'filesmanagement_bot';

      // ادمین مستقیم به پنل مدیریت می‌رود
      if (isAdmin(env, chatId)) {
        await showAdminMenu(chatId, TOKEN);
        return new Response('OK');
      }

      const user = await getUser(env, chatId);

      // ================================================================
      // تابع کمکی: تمدید/فعال‌سازی با توکن VR (خرید یا تمدید واقعی)
      // فایل‌های قبلی حذف نمی‌شوند — فقط مدت اعتبار افزوده می‌شود
      // ================================================================
      const handleRenewalToken = async () => {
        const payload = await verifyRenewalToken(env, param);
        if (!payload || payload.chatId !== chatId) {
          await sendMsg(chatId, '❌ لینک تمدید نامعتبر یا منقضی شده.', backKeyboard(), TOKEN);
          return;
        }
        const { txnId } = payload;

        // ============================================================
        // تشخیص تراکنش تکراری — کاملاً مستقل از ربات اول
        // اگر txn_id دارد: از جدول vip_consumed_txn چک می‌کند
        // اگر ندارد (backward compat): از vip_onboard_tokens چک می‌کند
        // ============================================================
        if (txnId) {
          // ============================================================
          // اگر txn_id قبلاً consumed شده → این کاربر قبلاً فعال/تمدید شده
          // در این حالت نباید تمدید مجدد انجام شود — فقط خوش‌آمد بگو
          // ============================================================
          const alreadyConsumed = await isTxnConsumed(env, txnId);
          if (alreadyConsumed) {
            // کاربر قبلاً با این txn_id فعال شده — فقط منوی اصلی نشان بده
            const existingUser = await getUser(env, chatId);
            if (existingUser && existingUser.status === 'active') {
              await env.DB.prepare('UPDATE vip_users SET first_name = ?, username = ? WHERE chat_id = ?')
                .bind(firstName, msg.from?.username || '', chatId).run();
              await showMain(chatId, { ...existingUser, first_name: firstName }, TOKEN, env);
            } else {
              await sendMsg(chatId,
                `👑 <b>خوش آمدید!</b>

اشتراک شما فعال است.`,
                null, TOKEN);
              if (existingUser) await showMain(chatId, existingUser, TOKEN, env);
            }
            return; // خروج بدون تمدید مجدد
          }
          // txn جدید است — ادامه برای تمدید/فعال‌سازی
          await markTxnConsumed(env, txnId);
        } else {
          // backward compat: بدون txn_id از hash توکن استفاده می‌کنیم
          const tokenHash = param.substring(0, 32);
          const used = await env.DB.prepare('SELECT token_hash FROM vip_onboard_tokens WHERE token_hash = ?')
            .bind(tokenHash).first();
          if (used) {
            // قدیمی: هم consumed بود → خوش‌آمد
            const existingUser = await getUser(env, chatId);
            if (existingUser) await showMain(chatId, existingUser, TOKEN, env);
            return;
          }
          await env.DB.prepare('INSERT OR IGNORE INTO vip_onboard_tokens (token_hash, used_at) VALUES (?, ?)')
            .bind(tokenHash, Date.now()).run();
        }

        const now = Date.now();

        if (!user) {
          // کاربر کاملاً جدید — اول‌بار وارد ربات سوم می‌شود
          const avail = await getAvailableRepo(env);
          if (!avail) { await sendMsg(chatId, `❌ ریپوی آزادی موجود نیست. با پشتیبانی تماس بگیرید.`, null, TOKEN); return; }
          const ok = await assignRepoToUser(env, chatId, avail.key, now, now + SUBSCRIPTION_DAYS * 86400000, msg.from?.username || '', firstName);
          if (!ok) { await sendMsg(chatId, `❌ خطا در تخصیص مخزن. دوباره تلاش کنید.`, null, TOKEN); return; }
          const newUser = await getUser(env, chatId);
          await sendMsg(chatId,
            `👑 <b>خوش آمدید به VIP!</b>\n\n✅ اشتراک اختصاصی فعال شد.\n📅 اعتبار: <b>${SUBSCRIPTION_DAYS} روز</b>\n💾 فضا: <b>${formatBytes(MAX_STORAGE_BYTES)}</b>`, null, TOKEN);
          await showMain(chatId, newUser, TOKEN, env);
          return;
        }

        if (user.status === 'active' && user.repo_key) {
          // کاربر فعال — تمدید اشتراک بدون حذف فایل‌های قبلی
          // اگر expires_at هنوز در آینده است، ۳۰ روز از آن اضافه می‌شود
          const currentExpiry = user.expires_at || now;
          const newExpiry = Math.max(currentExpiry, now) + SUBSCRIPTION_DAYS * 86400000;
          await env.DB.prepare('UPDATE vip_users SET subscribed_at = ?, expires_at = ?, first_name = ?, username = ? WHERE chat_id = ?')
            .bind(now, newExpiry, firstName, msg.from?.username || '', chatId).run();
          const updated = await getUser(env, chatId);
          const newExpiryDate = new Date(newExpiry).toLocaleDateString('fa-IR');
          await sendMsg(chatId,
            `✅ <b>اشتراک VIP تمدید شد!</b>\n\n📅 اعتبار جدید تا: <b>${newExpiryDate}</b>\n💾 فایل‌های قبلی شما دست‌نخورده باقی مانده‌اند.`,
            null, TOKEN);
          await showMain(chatId, { ...updated, first_name: firstName }, TOKEN, env);
          return;
        }

        if (user.status === 'grace') {
          // دوره مهلت — تمدید + بازگشت به active (فایل‌ها هنوز حذف نشده‌اند)
          const repoKey = user.repo_key || user.repo_key_backup;
          if (repoKey) {
            await env.DB.prepare("UPDATE vip_users SET status = 'active', repo_key = ?, repo_key_backup = NULL, subscribed_at = ?, expires_at = ?, first_name = ?, username = ? WHERE chat_id = ?")
              .bind(repoKey, now, now + SUBSCRIPTION_DAYS * 86400000, firstName, msg.from?.username || '', chatId).run();
          } else {
            const avail = await getAvailableRepo(env);
            if (!avail) { await sendMsg(chatId, `❌ ریپوی آزادی موجود نیست.`, null, TOKEN); return; }
            const ok = await assignRepoToUser(env, chatId, avail.key, now, now + SUBSCRIPTION_DAYS * 86400000, msg.from?.username || '', firstName);
            if (!ok) { await sendMsg(chatId, `❌ خطا در تخصیص مخزن. دوباره تلاش کنید.`, null, TOKEN); return; }
          }
          const updated = await getUser(env, chatId);
          await sendMsg(chatId, `✅ <b>اشتراک تمدید شد!</b>\n\n💾 فایل‌های قبلی شما دست‌نخورده‌اند.`, null, TOKEN);
          await showMain(chatId, { ...updated, first_name: firstName }, TOKEN, env);
          return;
        }

        if (user.status === 'revoked') {
          // اشتراک لغو شده — فایل‌های قبلی قبلاً حذف شده — ریپو تمیز اختصاص می‌گیرد
          const repoKey = user.repo_key_backup || (await getAvailableRepo(env))?.key;
          if (!repoKey) { await sendMsg(chatId, `❌ ریپوی آزادی موجود نیست.`, null, TOKEN); return; }
          const ok = await assignRepoToUser(env, chatId, repoKey, now, now + SUBSCRIPTION_DAYS * 86400000, msg.from?.username || '', firstName);
          if (!ok) { await sendMsg(chatId, `❌ خطا در تخصیص مخزن. دوباره تلاش کنید.`, null, TOKEN); return; }
          const updated = await getUser(env, chatId);
          await sendMsg(chatId,
            `👑 <b>اشتراک VIP مجدداً فعال شد!</b>\n\n✅ ${SUBSCRIPTION_DAYS} روز\n💾 ${formatBytes(MAX_STORAGE_BYTES)} فضای اختصاصی`, null, TOKEN);
          await showMain(chatId, updated, TOKEN, env);
          return;
        }
      };

      // ================================================================
      // توکن VR (تمدید/خرید) — اول از همه بررسی می‌شود، در هر وضعیتی
      // ================================================================
      if (param.startsWith('VR')) {
        await handleRenewalToken();
        return new Response('OK');
      }

      // ================================================================
      // کاربر فعال + توکن V یا بدون توکن → فقط خوش‌آمد (بدون تغییر اشتراک)
      // ================================================================
      if (user && user.status === 'active' && user.repo_key) {
        await env.DB.prepare('UPDATE vip_users SET first_name = ?, username = ? WHERE chat_id = ?')
          .bind(firstName, msg.from?.username || '', chatId).run();
        await showMain(chatId, { ...user, first_name: firstName }, TOKEN, env);
        return new Response('OK');
      }

      // ================================================================
      // کاربر grace بدون توکن VR → راهنما برای تمدید
      // ================================================================
      if (user && user.status === 'grace') {
        await sendMsg(chatId,
          `⚠️ <b>اشتراک شما منقضی شده است</b>\n\nبرای تمدید از ربات اصلی اقدام کنید:`,
          { inline_keyboard: [[{ text: '🔄 تمدید اشتراک', url: `https://t.me/${bot1}`, style: 'success' }]] }, TOKEN);
        return new Response('OK');
      }

      // ================================================================
      // کاربر revoked بدون توکن VR → راهنمای خرید
      // ================================================================
      if (user && user.status === 'revoked') {
        await sendMsg(chatId,
          `❌ <b>اشتراک شما به پایان رسیده است</b>\n\nبرای خرید مجدد اشتراک VIP:`,
          { inline_keyboard: [[{ text: '🛒 خرید اشتراک', url: `https://t.me/${bot1}`, style: 'success' }]] }, TOKEN);
        return new Response('OK');
      }

      // ================================================================
      // کاربر جدید با توکن V (backward compat — نباید پیش بیاید)
      // ================================================================
      if (!user && param && !param.startsWith('VR')) {
        const payload = await verifyVipToken(env, param);
        if (!payload || payload.chatId !== chatId) {
          await sendMsg(chatId, `❌ لینک نامعتبر یا منقضی شده.`, null, TOKEN);
          return new Response('OK');
        }
        const used = await env.DB.prepare('SELECT token_hash FROM vip_onboard_tokens WHERE token_hash = ?').bind(param.substring(0, 32)).first();
        if (used) { await sendMsg(chatId, `❌ این لینک قبلاً استفاده شده.`, null, TOKEN); return new Response('OK'); }
        await env.DB.prepare('INSERT OR IGNORE INTO vip_onboard_tokens (token_hash, used_at) VALUES (?, ?)').bind(param.substring(0, 32), Date.now()).run();
        const avail = await getAvailableRepo(env);
        if (!avail) { await sendMsg(chatId, `❌ ریپوی آزادی موجود نیست. با پشتیبانی تماس بگیرید.`, null, TOKEN); return new Response('OK'); }
        const now = Date.now();
        const ok = await assignRepoToUser(env, chatId, avail.key, now, now + SUBSCRIPTION_DAYS * 86400000, msg.from?.username || '', firstName);
        if (!ok) { await sendMsg(chatId, `❌ خطا در تخصیص مخزن. دوباره تلاش کنید.`, null, TOKEN); return new Response('OK'); }
        const newUser = await getUser(env, chatId);
        await sendMsg(chatId,
          `👑 <b>خوش آمدید به VIP!</b>\n\n✅ اشتراک اختصاصی فعال شد.\n📅 اعتبار: <b>${SUBSCRIPTION_DAYS} روز</b>\n💾 فضا: <b>${formatBytes(MAX_STORAGE_BYTES)}</b>`, null, TOKEN);
        await showMain(chatId, newUser, TOKEN, env);
        return new Response('OK');
      }

      // بدون توکن و بدون اشتراک
      await sendMsg(chatId, `🔒 <b>ربات اختصاصی VIP</b>\n\nاین ربات فقط برای کاربران دارای اشتراک VIP است.`,
        { inline_keyboard: [[{ text: '🛒 خرید اشتراک', url: `https://t.me/${bot1}`, style: 'success' }]] }, TOKEN);
      return new Response('OK');
    }
    // بررسی کاربر برای همه پیام‌های بعدی
    const user = await getUser(env, chatId);
    // ادمین می‌تواند بدون اشتراک VIP از ربات استفاده کند
    if (!isAdmin(env, chatId)) {
      if (!user || user.status === 'revoked') {
        await sendMsg(chatId, `🔒 دسترسی VIP ندارید.`,
          { inline_keyboard: [[{ text: '🛒 خرید اشتراک', url: `https://t.me/${env.BOT1_USERNAME || 'filesmanagement_bot'}`, style: 'success' }]] }, TOKEN);
        return new Response('OK');
      }
      if (user.status === 'grace') {
        await sendMsg(chatId, `⚠️ اشتراک منقضی. برای ادامه تمدید کنید.`,
          { inline_keyboard: [[{ text: '🔄 تمدید', url: `https://t.me/${env.BOT1_USERNAME || 'filesmanagement_bot'}`, style: 'success' }]] }, TOKEN);
        return new Response('OK');
      }
    }

    // State handler
    const state = await getState(env, chatId);

    // دریافت URL
    if (state?.step === 'awaiting_url') {
      if (!text.match(/^https?:\/\//)) {
        await sendMsg(chatId, `❌ لینک معتبر نیست. یک URL وارد کنید.`, cancelKeyboard(), TOKEN);
        return new Response('OK');
      }
      const fileName = text.split('/').pop()?.split('?')[0] || 'file';
      await setState(env, chatId, { step: 'awaiting_pass', type: 'link', fileUrl: text, fileName });
      const passBtn = generatePassword();
      await sendMsg(chatId, `📥 لینک دریافت شد.\n\n🔑 رمز فایل را تایپ کنید یا رمز تصادفی بزنید:`, passKeyboard(passBtn), TOKEN);
      return new Response('OK');
    }

    // دریافت فایل آپلود‌شده
    if (state?.step === 'awaiting_file') {
      const doc = msg.document || msg.video || msg.audio || (msg.photo && msg.photo[msg.photo.length - 1]);
      if (!doc) {
        await sendMsg(chatId, `❌ فایل دریافت نشد. لطفاً یک فایل ارسال کنید.`, cancelKeyboard(), TOKEN);
        return new Response('OK');
      }
      await setState(env, chatId, { step: 'awaiting_pass', type: 'upload', fileId: doc.file_id, msgId: msg.message_id, fileName: doc.file_name || 'file', fileSize: doc.file_size || 0 });
      const passBtn = generatePassword();
      await sendMsg(chatId, `✅ فایل دریافت شد.\n\n🔑 رمز فایل را تایپ کنید یا رمز تصادفی بزنید:`, passKeyboard(passBtn), TOKEN);
      return new Response('OK');
    }

    // دریافت لینک یوتیوب
    if (state?.step === 'awaiting_yt_url') {
      const ytRegex = /^https?:\/\/(www\.)?(youtube\.com\/(watch\?v=|shorts\/|embed\/)|youtu\.be\/)/i;
      if (!ytRegex.test(text.trim())) {
        await sendMsg(chatId, `❌ لینک یوتیوب معتبر نیست.`, cancelKeyboard(), TOKEN);
        return new Response('OK');
      }
      await setState(env, chatId, { step: 'awaiting_yt_quality', youtubeUrl: text.trim(), type: 'youtube' });
      await sendMsg(chatId, `🎬 <b>کیفیت ویدیو را انتخاب کنید:</b>`,
        { inline_keyboard: [
          [
            { text: '📺 1080p', callback_data: 'yt_q:1080', style: 'primary' },
            { text: '📺 720p',  callback_data: 'yt_q:720',  style: 'primary' },
            { text: '📺 480p',  callback_data: 'yt_q:480',  style: 'primary' },
          ],
          [{ text: '❌ انصراف', callback_data: 'cancel', style: 'danger' }],
        ] }, TOKEN);
      return new Response('OK');
    }

    // دریافت رمز (متنی)
    if (state?.step === 'awaiting_pass') {
      const password = text.trim().replace(/[^A-Za-z0-9!@#$%^&*.\-]/g, '').substring(0, 12);
      if (password.length < 3) {
        await sendMsg(chatId, `❌ رمز باید حداقل ۳ کاراکتر باشد.`, cancelKeyboard(), TOKEN);
        return new Response('OK');
      }
      await deleteState(env, chatId);
      await startDownload(env, chatId, state, password, user, TOKEN);
      return new Response('OK');
    }

    // ============================================================
    // پردازش state های ادمین
    // ============================================================
    if (isAdmin(env, chatId)) {
      const admState = await getState(env, chatId);

      // دریافت اطلاعات مخزن جدید با فرمت owner/repo/GH_TOKEN_X
      if (admState?.step === 'adm_addrepo_input') {
        await deleteState(env, chatId);
        const parts = text.trim().split('/');
        if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) {
          await sendMsg(chatId,
            `❌ فرمت نادرست.\n\nباید به شکل <code>owner/repo-name/GH_TOKEN_1</code> باشد.`,
            { inline_keyboard: [[{ text: '🔙 مخازن', callback_data: 'adm_repos', style: 'primary' }]] }, TOKEN);
          return new Response('OK');
        }
        const [owner, repoName, tokenSecret] = parts.map(p => p.trim());
        // بررسی وجود توکن در env
        if (!env[tokenSecret]) {
          await sendMsg(chatId,
            `❌ Secret با نام <code>${tokenSecret}</code> در Cloudflare یافت نشد.\n\nابتدا آن را در Workers > Settings > Variables and Secrets اضافه کنید، سپس دوباره تلاش کنید.`,
            { inline_keyboard: [[{ text: '🔙 مخازن', callback_data: 'adm_repos', style: 'primary' }]] }, TOKEN);
          return new Response('OK');
        }
        // ساخت کلید خودکار: REPO_1، REPO_2، ...
        const allRows = await env.DB.prepare('SELECT repo_key FROM repos ORDER BY repo_key ASC').all();
        let maxNum = 0;
        for (const r of (allRows.results || [])) {
          const m = r.repo_key.match(/^REPO_(\d+)$/);
          if (m) maxNum = Math.max(maxNum, parseInt(m[1]));
        }
        const newKey = `REPO_${maxNum + 1}`;
        // بررسی تکراری نبودن owner/name
        const exists = await env.DB.prepare('SELECT repo_key FROM repos WHERE owner = ? AND name = ?').bind(owner, repoName).first();
        if (exists) {
          await sendMsg(chatId,
            `❌ مخزن <code>${owner}/${repoName}</code> قبلاً با کلید <b>${exists.repo_key}</b> اضافه شده.`,
            { inline_keyboard: [[{ text: '🔙 مخازن', callback_data: 'adm_repos', style: 'primary' }]] }, TOKEN);
          return new Response('OK');
        }
        await env.DB.prepare('INSERT INTO repos (repo_key, owner, name, token_secret, created_at) VALUES (?, ?, ?, ?, ?)')
          .bind(newKey, owner, repoName, tokenSecret, Date.now()).run();
        await sendMsg(chatId,
          `✅ مخزن <b>${newKey}</b> اضافه شد!\n\n` +
          `📦 <code>${owner}/${repoName}</code>\n🔑 Secret: <code>${tokenSecret}</code>`,
          { inline_keyboard: [[{ text: '🗄 مشاهده مخازن', callback_data: 'adm_repos', style: 'primary' }]] }, TOKEN);
        return new Response('OK');
      }

      // جستجوی کاربر بر اساس chat_id یا username
      if (admState?.step === 'adm_search') {
        await deleteState(env, chatId);
        const query = text.trim().replace('@', '');
        let targetUser = null;
        // اول با chat_id چک کن
        if (/^\d+$/.test(query)) {
          targetUser = await getUser(env, query);
        }
        // بعد با username
        if (!targetUser) {
          targetUser = await env.DB.prepare('SELECT * FROM vip_users WHERE username = ?').bind(query).first();
        }
        if (!targetUser) {
          await sendMsg(chatId, `❌ کاربری با این مشخصات یافت نشد.`,
            { inline_keyboard: [[{ text: '🔙 منوی ادمین', callback_data: 'adm_menu', style: 'primary' }]] }, TOKEN);
          return new Response('OK');
        }
        await showAdminUserProfile(env, chatId, targetUser.chat_id, TOKEN);
        return new Response('OK');
      }

      // تغییر زمان اشتراک — دریافت تعداد روز
      if (admState?.step === 'adm_chtime') {
        const days = parseInt(text.trim());
        if (isNaN(days) || days === 0) {
          await sendMsg(chatId, `❌ عدد معتبر وارد کنید (مثبت برای افزایش، منفی برای کاهش).`,
            { inline_keyboard: [[{ text: '❌ انصراف', callback_data: `adm_user:${admState.targetChatId}`, style: 'danger' }]] }, TOKEN);
          return new Response('OK');
        }
        await deleteState(env, chatId);
        const targetUser = await getUser(env, admState.targetChatId);
        if (!targetUser) {
          await sendMsg(chatId, `❌ کاربر یافت نشد.`, null, TOKEN);
          return new Response('OK');
        }
        const currentExpiry = Math.max(targetUser.expires_at || Date.now(), Date.now());
        const newExpiry = currentExpiry + days * 86400000;
        await env.DB.prepare('UPDATE vip_users SET expires_at = ? WHERE chat_id = ?')
          .bind(newExpiry, admState.targetChatId).run();
        const newExpiryDate = new Date(newExpiry).toLocaleDateString('fa-IR');
        // اطلاع به کاربر
        const changeText = days > 0
          ? `✅ <b>اشتراک شما تمدید شد!</b>\n\n📅 تاریخ انقضای جدید: <b>${newExpiryDate}</b>`
          : `⚠️ <b>اشتراک شما کوتاه شد.</b>\n\n📅 تاریخ انقضای جدید: <b>${newExpiryDate}</b>`;
        await sendMsg(admState.targetChatId, changeText, null, TOKEN);
        await sendMsg(chatId,
          `✅ زمان اشتراک کاربر <code>${admState.targetChatId}</code> به‌روز شد.\n📅 انقضای جدید: <b>${newExpiryDate}</b>`,
          { inline_keyboard: [[{ text: '🔙 پروفایل کاربر', callback_data: `adm_user:${admState.targetChatId}`, style: 'primary' }]] }, TOKEN);
        return new Response('OK');
      }

      // تغییر مخزن — دریافت کلید مخزن
      if (admState?.step === 'adm_chrepo') {
        const repoKey = text.trim().toUpperCase();
        await deleteState(env, chatId);
        const repo = await getRepoByKey(env, repoKey);
        if (!repo) {
          await sendMsg(chatId, `❌ مخزنی با کلید <b>${repoKey}</b> یافت نشد.\n\nکلیدها: REPO_1، REPO_2 و ...`,
            { inline_keyboard: [[{ text: '🔙 پروفایل کاربر', callback_data: `adm_user:${admState.targetChatId}`, style: 'danger' }]] }, TOKEN);
          return new Response('OK');
        }
        await env.DB.prepare('UPDATE vip_users SET repo_key = ? WHERE chat_id = ?')
          .bind(repoKey, admState.targetChatId).run();
        const targetUser = await getUser(env, admState.targetChatId);
        // اطلاع به کاربر
        await sendMsg(admState.targetChatId,
          `🔄 <b>مخزن اختصاصی شما تغییر کرد.</b>\n\n📦 مخزن جدید: <b>${repo.owner}/${repo.name}</b>`, null, TOKEN);
        await sendMsg(chatId,
          `✅ مخزن کاربر <code>${admState.targetChatId}</code> به <b>${repoKey}</b> تغییر یافت.`,
          { inline_keyboard: [[{ text: '🔙 پروفایل کاربر', callback_data: `adm_user:${admState.targetChatId}`, style: 'primary' }]] }, TOKEN);
        return new Response('OK');
      }
    }

    // منوی اصلی پیش‌فرض
    await showMain(chatId, user, TOKEN, env);
    return new Response('OK');
  },

  async scheduled(event, env, ctx) {
  const TOKEN = env.TELEGRAM_TOKEN;
  if (TOKEN) {
    ctx.waitUntil(initDB(env)); // اضافه کنید
    ctx.waitUntil(checkExpired(env, TOKEN));
  }
}
};

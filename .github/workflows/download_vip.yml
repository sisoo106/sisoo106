// نمایش مخازن موجود
async function showAdminRepos(env, chatId, TOKEN, editMsgId) {
  const repos = await getAllRepos(env);
  const assigned = await env.DB.prepare(
    "SELECT repo_key, chat_id, first_name, username FROM vip_users WHERE repo_key IS NOT NULL AND status != 'revoked'"
  ).all();
  const assignedMap = {};
  for (const r of (assigned.results || [])) assignedMap[r.repo_key] = r;

  let text = `🗄 <b>مخازن موجود</b> (${repos.length} عدد)\n\n`;
  const btns = [];

  if (repos.length === 0) {
    text += `هیچ مخزنی اضافه نشده.\n`;
  } else {
    for (const r of repos) {
      const user = assignedMap[r.key];
      const status = user ? `👤 ${user.first_name || user.chat_id}` : `🆓 آزاد`;
      text += `• <b>${r.key}</b>: <code>${r.owner}/${r.name}</code>\n  🔑 <code>${r.tokenSecret}</code> — ${status}\n\n`;
      btns.push([{ text: `🗑 حذف ${r.key}`, callback_data: `adm_delrepo:${r.key}`, style: 'danger' }]);
    }
  }

  btns.push([{ text: '➕ اضافه کردن مخزن جدید', callback_data: 'adm_addrepo', style: 'success' }]);
  btns.push([{ text: '🔙 منوی ادمین', callback_data: 'adm_menu', style: 'primary' }]);
  const kb = { inline_keyboard: btns };
  if (editMsgId) return await editMsg(chatId, editMsgId, text, kb, TOKEN);
  return await sendMsg(chatId, text, kb, TOKEN);
}

// ============================================================
// دیتابیس
// ============================================================
async function initDB(env) {
  try {
    // جدول مخازن — owner/name در D1، توکن فقط در Cloudflare Secrets
    await env.DB.prepare(`CREATE TABLE IF NOT EXISTS repos (
      repo_key TEXT PRIMARY KEY,
      owner TEXT NOT NULL,
      name TEXT NOT NULL,
      token_secret TEXT NOT NULL,
      created_at INTEGER
    )`).run();
    await env.DB.prepare(`CREATE TABLE IF NOT EXISTS vip_users (
      chat_id TEXT PRIMARY KEY, repo_key TEXT, repo_key_backup TEXT,
      subscribed_at INTEGER, expires_at INTEGER, status TEXT DEFAULT 'active',
      username TEXT, first_name TEXT
    )`).run();
    await env.DB.prepare(`CREATE TABLE IF NOT EXISTS vip_files (
      id INTEGER PRIMARY KEY AUTOINCREMENT, chat_id TEXT, branch_name TEXT,
      file_name TEXT, file_size INTEGER DEFAULT 0, created_at INTEGER,
      type TEXT DEFAULT 'file', link TEXT, zip_password TEXT, message_id INTEGER
    )`).run();
    await env.DB.prepare(`CREATE TABLE IF NOT EXISTS vip_jobs (
      chat_id TEXT PRIMARY KEY, status TEXT, payload TEXT,
      message_id INTEGER, branch_name TEXT, updated_at INTEGER
    )`).run();
    await env.DB.prepare(`CREATE TABLE IF NOT EXISTS vip_state (
      chat_id TEXT PRIMARY KEY, state TEXT, updated_at INTEGER
    )`).run();
    await env.DB.prepare(`CREATE TABLE IF NOT EXISTS vip_onboard_tokens (
      token_hash TEXT PRIMARY KEY, used_at INTEGER
    )`).run();
    await env.DB.prepare(`CREATE TABLE IF NOT EXISTS bot_settings (
      key TEXT PRIMARY KEY, value TEXT
    )`).run();
    await env.DB.prepare('DELETE FROM vip_onboard_tokens WHERE used_at < ?')
      .bind(Date.now() - 10 * 60 * 1000).run();
    // جدول txn_id های مصرف‌شده — ربات سوم اینجا ذخیره می‌کند تا تراکنش تکراری رد کند
    await env.DB.prepare(`CREATE TABLE IF NOT EXISTS vip_consumed_txn (
      txn_id TEXT PRIMARY KEY,
      consumed_at INTEGER NOT NULL
    )`).run();
    // پاک‌سازی txn های قدیمی (بیشتر از ۳۰ روز) — نیاز به نگهداری بیشتر نیست
    await env.DB.prepare('DELETE FROM vip_consumed_txn WHERE consumed_at < ?')
      .bind(Date.now() - 30 * 24 * 60 * 60 * 1000).run();
  } catch (e) { console.error('initDB error:', e); }
}

async function getUser(env, chatId) {
  return await env.DB.prepare('SELECT * FROM vip_users WHERE chat_id = ?').bind(chatId).first();
}
async function setState(env, chatId, state) {
  await env.DB.prepare('INSERT OR REPLACE INTO vip_state (chat_id, state, updated_at) VALUES (?, ?, ?)')
    .bind(chatId, JSON.stringify(state), Date.now()).run();
}
async function getState(env, chatId) {
  const row = await env.DB.prepare('SELECT state FROM vip_state WHERE chat_id = ?').bind(chatId).first();
  return row ? JSON.parse(row.state) : null;
}
async function deleteState(env, chatId) {
  await env.DB.prepare('DELETE FROM vip_state WHERE chat_id = ?').bind(chatId).run();
}
async function getJob(env, chatId) {
  const row = await env.DB.prepare('SELECT * FROM vip_jobs WHERE chat_id = ?').bind(chatId).first();
  if (!row) return null;
  return { ...row, payload: row.payload ? JSON.parse(row.payload) : {} };
}
async function setJob(env, chatId, status, payload, messageId, branchName) {
  await env.DB.prepare(
    'INSERT OR REPLACE INTO vip_jobs (chat_id, status, payload, message_id, branch_name, updated_at) VALUES (?, ?, ?, ?, ?, ?)'
  ).bind(chatId, status, JSON.stringify(payload), messageId, branchName, Date.now()).run();
}
async function deleteJob(env, chatId) {
  await env.DB.prepare('DELETE FROM vip_jobs WHERE chat_id = ?').bind(chatId).run();
}
async function getUserStorageBytes(env, chatId) {
  const row = await env.DB.prepare(
    'SELECT COALESCE(SUM(file_size), 0) AS total FROM vip_files WHERE chat_id = ?'
  ).bind(chatId).first();
  return row ? Number(row.total) : 0;
}

// ============================================================
// توابع کمکی
// ============================================================
function formatBytes(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}
function buildBar(percent) {
  const f = Math.round(percent / 10);
  return '█'.repeat(f) + '░'.repeat(10 - f);
}
function generatePassword() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  return Array.from({length: 8}, () => c[Math.floor(Math.random() * c.length)]).join('');
}

// ============================================================
// تلگرام
// ============================================================
async function tgCall(TOKEN, method, body) {
  const res = await fetch(`https://api.telegram.org/bot${TOKEN}/${method}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return await res.json();
}
async function sendMsg(chatId, text, keyboard, TOKEN) {
  const body = { chat_id: chatId, text, parse_mode: 'HTML' };
  if (keyboard) body.reply_markup = JSON.stringify(keyboard);
  return await tgCall(TOKEN, 'sendMessage', body);
}
async function editMsg(chatId, msgId, text, keyboard, TOKEN) {
  if (!msgId) return await sendMsg(chatId, text, keyboard, TOKEN);
  const body = { chat_id: chatId, message_id: msgId, text, parse_mode: 'HTML' };
  if (keyboard) body.reply_markup = JSON.stringify(keyboard);
  const result = await tgCall(TOKEN, 'editMessageText', body);
  if (!result.ok && result.error_code !== 400) {
    return await sendMsg(chatId, text, keyboard, TOKEN);
  }
  return result;
}
async function delMsg(chatId, msgId, TOKEN) {
  if (!msgId) return;
  await tgCall(TOKEN, 'deleteMessage', { chat_id: chatId, message_id: msgId });
}

